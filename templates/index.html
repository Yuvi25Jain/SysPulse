<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysPulse Dashboard</title>
</head>
<body>

    <h1>🚀 SysPulse Dashboard</h1>

    <div id="data">
        Loading Linux Metrics...
    </div>

    <script>
        async function loadData() {
            const response = await fetch('/api/stats');
            const data = await response.json();

            document.getElementById("data").innerHTML = `
                <h3>System Information</h3>
                <p><strong>Hostname:</strong> ${data.hostname}</p>
                <p><strong>Operating System:</strong> ${data.os}</p>
                <p><strong>CPU Usage:</strong> ${data.cpu}%</p>
                <p><strong>Memory Usage:</strong> ${data.memory}%</p>
                <p><strong>Disk Usage:</strong> ${data.disk}%</p>
            `;
        }

        loadData();
        setInterval(loadData, 2000);
    </script>

</body>
</html>
